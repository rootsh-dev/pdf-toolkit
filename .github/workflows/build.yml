name: Build Cross-Platform Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: pdf-toolkit-${{ github.ref_name }}-windows-x64.exe
            build_path: dist/pdf_toolkit.exe
            extra_flags: "--include-package=comtypes --windows-console-mode=disable"
          - os: ubuntu-latest
            asset_name: pdf-toolkit-${{ github.ref_name }}-linux-x64
            build_path: dist/pdf_toolkit
            extra_flags: ""
          - os: macos-latest
            asset_name: pdf-toolkit-${{ github.ref_name }}-macos-arm64.zip
            build_path: dist/pdf_toolkit.app
            extra_flags: "--macos-create-app-bundle"
          - os: macos-15-intel
            asset_name: pdf-toolkit-${{ github.ref_name }}-macos-x64.zip
            build_path: dist/pdf_toolkit.app
            extra_flags: "--macos-create-app-bundle"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      # patchelf is required by Nuitka's onefile mode on Linux
      - name: Install patchelf (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      # Compiles to native machine code via C (stronger protection than bytecode obfuscation); flags verified against pdf_toolkit.py's real imports
      - name: Build with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --onefile --standalone --assume-yes-for-downloads \
            --output-dir=dist --output-filename=pdf_toolkit --remove-output \
            --enable-plugin=tk-inter \
            --enable-plugin=numpy \
            --include-package=fitz \
            --include-package=pypdfium2 \
            --include-package-data=pypdfium2 \
            --include-package=cryptography \
            --include-package=PIL \
            --include-package=cv2 \
            --include-package=pdfminer \
            --include-package=pdfplumber \
            --include-package=docx \
            --include-package=pptx \
            --include-package=pdf2docx \
            --include-package=reportlab \
            --include-package=xlsxwriter \
            --include-package=lxml \
            --include-package=fontTools \
            ${{ matrix.extra_flags }} \
            pdf_toolkit.py

      # GitHub release assets must be single files, so the .app bundle (a directory) gets zipped
      - name: Zip macOS app bundle
        if: startsWith(matrix.os, 'macos')
        run: cd dist && zip -r "${{ matrix.asset_name }}" pdf_toolkit.app

      - name: Rename build output to final asset name (Windows/Linux)
        if: "!startsWith(matrix.os, 'macos')"
        shell: bash
        run: cp "${{ matrix.build_path }}" "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
